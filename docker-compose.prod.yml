name: andres-ai-agent

services:
  backend:
    # Built and pushed by GitHub Actions; scripts/deploy.sh exports ECR_IMAGE
    # pinned to a commit SHA. The placeholder fallback keeps plain `docker compose
    # down/ps` working, while making an un-exported `up` fail loudly.
    image: ${ECR_IMAGE:-andres-ai-api:unset}
    container_name: andres-ai-agent_backend
    restart: unless-stopped
    env_file: .env
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - 8000

  db:
    image: pgvector/pgvector:pg17
    container_name: andres-ai-agent_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - chat_agent_db_data:/var/lib/postgresql/data
    # Bound to loopback only. Reach it from a laptop with an SSM port-forward:
    #   aws ssm start-session --target <instance-id> \
    #     --document-name AWS-StartPortForwardingSessionToRemoteHost \
    #     --parameters '{"host":["localhost"],"portNumber":["5432"],"localPortNumber":["15432"]}'
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7
    container_name: andres-ai-agent_redis
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: andres-ai-agent_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./compose/prod/Caddyfile:/etc/caddy/Caddyfile
      - ./caddy-data:/data
      - ./caddy-config:/config
    depends_on:
      - backend

volumes:
  # Pre-existing Postgres data volume from before the project was renamed to
  # `andres-ai-agent`. We reference it externally so the data survives.
  chat_agent_db_data:
    external: true
    name: andresai-agent_chat_agent_db_data
