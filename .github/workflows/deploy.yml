name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Redeploy an already-built tag, e.g. sha-1a2b3c4 (rollback). Leave blank to build this branch."
        required: false
        default: ""

# One production deploy at a time, and never cancel one midway through a
# migration or container swap.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write # required to mint the OIDC token for AWS
  contents: read

# Account id, role arn and instance id live in repository secrets rather than
# here: this repo is public, and so are its Actions logs.
env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: andres-ai-api

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    # A rollback redeploys an image that already passed these checks.
    if: inputs.image_tag == ''
    steps:
      - uses: actions/checkout@v7
      # setup-uv stopped publishing floating major tags after v7, so this is
      # pinned to an exact release rather than a major.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  build:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: test
    if: inputs.image_tag == ''
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7

      - id: meta
        run: echo "image_tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: docker/setup-buildx-action@v4

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: compose/prod/Dockerfile
          platforms: linux/amd64 # the EC2 host is x86_64
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }}
            ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    # Runs after a successful build, or straight away when redeploying an
    # existing tag (in which case test and build are skipped).
    if: |
      always() && !cancelled() &&
      (needs.build.result == 'success' ||
       (needs.build.result == 'skipped' && inputs.image_tag != ''))
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run deploy on the instance via SSM
        env:
          IMAGE_TAG: ${{ inputs.image_tag != '' && inputs.image_tag || needs.build.outputs.image_tag }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: |
          set -euo pipefail
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "Deploying: $IMAGE"

          # Check out the commit the image was built from, so that a rollback
          # also rolls back the compose file and Caddyfile rather than pairing
          # an old image with today's config.
          if [ "${IMAGE_TAG#sha-}" != "$IMAGE_TAG" ]; then
            GIT_REF="${IMAGE_TAG#sha-}"
          else
            GIT_REF="origin/main"
          fi
          echo "Config from: $GIT_REF"

          # Run the freshly-pulled deploy script from a copy in /tmp so that
          # `git reset` cannot rewrite it mid-run.
          REMOTE="export HOME=/root \
            && cd /home/ubuntu/AndresAI-Agent \
            && git fetch --prune origin main \
            && git reset --hard $GIT_REF \
            && install -m 755 scripts/deploy.sh /tmp/deploy-current.sh \
            && /tmp/deploy-current.sh $IMAGE"

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $IMAGE_TAG" \
            --timeout-seconds 900 \
            --cli-input-json "$(jq -n --arg s "$REMOTE" '{Parameters:{commands:[$s]}}')" \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          # Poll to completion. The invocation can 404 for a moment right after
          # send-command, so tolerate failures early in the loop.
          STATUS=Pending
          for _ in $(seq 1 120); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done

          echo "--- deploy output ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          ERR=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text)
          if [ -n "$ERR" ] && [ "$ERR" != "None" ]; then
            echo "--- stderr ---"; echo "$ERR"
          fi

          echo "Final status: $STATUS"
          [ "$STATUS" = "Success" ]

      - name: Verify the API is serving
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' https://andres-ai-api.aduquehd.com/docs || echo 000)
            echo "attempt $i: HTTP $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 6
          done
          echo "API did not return 200 after deploy"; exit 1
